<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Annular routing laboratory</title>

      <header>

      <section class="lab-card">
        <div id="annular-routing-lab" class="lab-figure"></div>
        <div id="summary" class="summary" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="/src/dev/annularRoutingLab.ts"></script>
