<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive curved noncrossing partition diagrams rendered as exportable SVG"
    />
    <title>Permutation Visualizer</title>
  </head>
  <body>
    <main class="shell">
      <header class="heading">
        <h1>Curved permutation diagrams</h1>
      </header>

      <section class="toolbar" aria-label="Diagram controls">
        <label class="example-control">
          Example
          <select id="example-select"></select>
        </label>
        <div class="selection-summary" aria-live="polite">
          <output id="selection-output">No edge selected</output>
          <button id="clear-button" type="button" disabled>Clear</button>
        </div>
        <label class="check-control">
          <input id="direction-toggle" type="checkbox" />
          Show direction
        </label>
        <button
          id="export-button"
          class="icon-button"
          type="button"
          aria-label="Download SVG"
          title="Download SVG"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 15v4h14v-4" />
          </svg>
        </button>
        <form id="partition-form" class="partition-form">
          <label for="partition-input">Partition</label>
          <input
            id="partition-input"
            type="text"
            spellcheck="false"
            autocomplete="off"
            aria-describedby="partition-message"
          />
          <button type="submit">Render</button>
        </form>
        <fieldset class="view-toggle">
          <legend>Show</legend>
          <label><input type="radio" name="display-mode" value="partition" checked /> π</label>
          <label><input type="radio" name="display-mode" value="kreweras" /> Kr(π)</label>
        </fieldset>
        <p id="partition-message" class="partition-message" aria-live="polite"></p>
      </section>

      <section class="workspace">
        <div id="figure" class="figure" aria-label="Permutation diagram"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
