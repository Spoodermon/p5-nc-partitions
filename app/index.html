<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive disc and annular noncrossing diagrams rendered as exportable SVG" />
    <title>Permutation Visualizer</title>
  </head>
  <body>
    <main class="shell">
      <header class="heading">
        <h1>Curved permutation diagrams</h1>
        <fieldset class="surface-toggle" aria-label="Mathematical surface">
          <label><input type="radio" name="surface-mode" value="disc" checked /><span>Disc</span></label>
          <label><input type="radio" name="surface-mode" value="annular" /><span>Annular</span></label>
        </fieldset>
      </header>
      <section class="toolbar" aria-label="Diagram controls">
        <label class="example-control">Example<select id="example-select"></select></label>
        <label class="check-control"><input id="direction-toggle" type="checkbox" />Show direction</label>
        <button id="export-button" class="icon-button" type="button" aria-label="Download SVG" title="Download SVG"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 15v4h14v-4" /></svg></button>

        <div id="disc-controls" class="mode-inputs">
          <form id="disc-form" class="notation-form">
            <label for="disc-input">Partition</label>
            <input id="disc-input" type="text" spellcheck="false" autocomplete="off" aria-describedby="disc-message" />
            <button id="disc-random-button" class="secondary-button" type="button">Random NC</button>
            <label for="disc-n">n<input id="disc-n" class="size-input" type="text" inputmode="numeric" autocomplete="off" /></label>
            <button type="submit">Render</button>
          </form>
          <fieldset class="view-toggle"><legend>Show</legend><label><input type="radio" name="disc-display-mode" value="partition" checked /> π</label><label><input type="radio" name="disc-display-mode" value="kreweras" /> Kr(π)</label></fieldset>
          <p id="disc-message" class="input-message" aria-live="polite"></p>
        </div>

        <div id="annular-controls" class="mode-inputs" hidden>
          <form id="annular-form" class="annular-form">
            <label class="annular-notation" for="annular-input">Permutation<input id="annular-input" type="text" spellcheck="false" autocomplete="off" aria-describedby="annular-message" /></label>
            <button id="annular-random-button" class="secondary-button" type="button">Random ANC</button>
            <label for="annular-p">p<input id="annular-p" type="text" inputmode="numeric" autocomplete="off" aria-describedby="annular-message" /></label>
            <label for="annular-q">q<input id="annular-q" type="text" inputmode="numeric" autocomplete="off" aria-describedby="annular-message" /></label>
            <button type="submit">Render</button>
          </form>
          <fieldset class="view-toggle"><legend>Show</legend><label><input type="radio" name="annular-display-mode" value="permutation" checked /> τ</label><label><input type="radio" name="annular-display-mode" value="kreweras" /> Kr(τ)</label></fieldset>
          <p id="annular-message" class="input-message" aria-live="polite"></p>
          <div id="routing-progress" class="routing-progress" hidden><progress aria-label="Annular routing progress"></progress><span id="routing-progress-label">Preparing routing search…</span></div>
        </div>
      </section>
      <section class="workspace">
        <aside class="side-panel thickness-controls" aria-label="Line thickness controls">
          <h2>Line weights</h2>
          <label>Cycle edges<input id="cycle-edge-thickness" type="range" min="1" max="8" step="0.2" value="3.4" /><output id="cycle-edge-thickness-output" for="cycle-edge-thickness">3.4</output></label>
          <label>Outer boundary<input id="outer-boundary-thickness" type="range" min="0.5" max="8" step="0.1" value="2.5" /><output id="outer-boundary-thickness-output" for="outer-boundary-thickness">2.5</output></label>
          <label id="inner-boundary-control" hidden>Inner boundary<input id="inner-boundary-thickness" type="range" min="0.5" max="8" step="0.1" value="2.5" /><output id="inner-boundary-thickness-output" for="inner-boundary-thickness">2.5</output></label>
          <label class="font-control" for="number-font">Number font<select id="number-font"><option value="Newsreader">Newsreader</option><option value="Geist">Geist Sans</option><option value="Geist Mono">Geist Mono</option></select></label>
          <div class="selection-summary" aria-live="polite"><output id="selection-output">No edge selected</output><button id="clear-button" type="button" disabled>Clear</button></div>
        </aside>
        <div id="figure" class="figure" aria-label="Permutation diagram"></div>
        <aside class="side-panel color-controls" aria-label="Cycle colour controls">
          <h2>Cycle colours</h2>
          <label class="field-label" for="color-mode">Assignment<select id="color-mode"><option value="palette">Palette</option><option value="single">One colour</option><option value="kind">By annular kind</option><option value="custom">Per cycle</option></select></label>
          <div id="palette-options" class="palette-options" aria-label="Named palettes"></div>
          <label id="single-color-control" class="color-row" hidden>All cycles<input id="single-color" type="color" value="#176b75" /></label>
          <div id="kind-color-controls" hidden><label class="color-row">Outer–outer<input id="outer-cycle-color" type="color" value="#176b75" /></label><label class="color-row">Inner–inner<input id="inner-cycle-color" type="color" value="#a35428" /></label><label class="color-row">Through<input id="through-cycle-color" type="color" value="#62549a" /></label></div>
          <div id="cycle-color-controls" class="cycle-color-list" hidden></div>
          <label class="check-control fill-control"><input id="ribbon-fill-toggle" type="checkbox" />Ribbon fill</label>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
