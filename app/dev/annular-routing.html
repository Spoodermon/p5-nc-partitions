<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Annular routing laboratory</title>
  </head>
  <body>
    <main class="lab-shell">
      <header>
        <h1>Global annular routing</h1>
        <p>Complete permutations, coordinated lifts, lanes, and clearance diagnostics.</p>
      </header>
      <section class="controls" aria-label="Routing laboratory controls">
        <label>Fixture <select id="fixture"></select></label>
        <label class="check"><input id="directions" type="checkbox" checked /> Direction</label>
        <label class="check"><input id="ribbon-fill" type="checkbox" /> Ribbon fill</label>
        <label class="check"><input id="diagnostics" type="checkbox" /> Diagnostics</label>
        <label class="slider-control">Cycle edges <input id="cycle-edge-thickness" type="range" min="1" max="8" step="0.2" value="3.4" /><output id="cycle-edge-thickness-output" for="cycle-edge-thickness">3.4</output></label>
        <label class="slider-control">Outer boundary <input id="outer-boundary-thickness" type="range" min="0.5" max="8" step="0.1" value="2.2" /><output id="outer-boundary-thickness-output" for="outer-boundary-thickness">2.2</output></label>
        <label class="slider-control">Inner boundary <input id="inner-boundary-thickness" type="range" min="0.5" max="8" step="0.1" value="2.2" /><output id="inner-boundary-thickness-output" for="inner-boundary-thickness">2.2</output></label>
      </section>
      <section class="lab-card">
        <div id="annular-routing-lab" class="lab-figure"></div>
        <div id="summary" class="summary" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="/src/dev/annularRoutingLab.ts"></script>
  </body>
</html>
